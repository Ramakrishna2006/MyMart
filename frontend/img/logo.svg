<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MyMart logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="mmbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16b866"/><stop offset="1" stop-color="#086b3d"/>
    </linearGradient>
    <linearGradient id="mmshine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/><stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="mmglow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#mmbg)"/>
  <rect width="512" height="512" rx="116" fill="url(#mmshine)"/>
  <circle cx="270" cy="250" r="200" fill="url(#mmglow)"/>
  <g transform="translate(-8 -22)">
  <!-- cart handle -->
  <path d="M84 132 H136 L170 196" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- basket = database cylinder -->
  <path d="M166 200 V332 A106 34 0 0 0 378 332 V200" fill="#ffffff"/>
  <ellipse cx="272" cy="200" rx="106" ry="34" fill="#ffffff"/>
  <ellipse cx="272" cy="200" rx="84" ry="20" fill="#0c8a4f"/>
  <path d="M166 246 A106 34 0 0 0 378 246" fill="none" stroke="#0c8a4f" stroke-width="12"/>
  <path d="M166 290 A106 34 0 0 0 378 290" fill="none" stroke="#0c8a4f" stroke-width="12"/>
  <!-- data dots on the discs -->
  <circle cx="340" cy="258" r="8" fill="#f59e0b"/>
  <circle cx="340" cy="302" r="8" fill="#f59e0b"/>
  <!-- cart base + wheels -->
  <path d="M178 382 H372" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
  <circle cx="204" cy="420" r="26" fill="#ffffff"/>
  <circle cx="204" cy="420" r="10" fill="#0c8a4f"/>
  <circle cx="346" cy="420" r="26" fill="#ffffff"/>
  <circle cx="346" cy="420" r="10" fill="#0c8a4f"/>
  </g>
</svg>
